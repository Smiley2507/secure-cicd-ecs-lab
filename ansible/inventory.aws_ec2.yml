---
plugin: amazon.aws.aws_ec2

regions:
  - eu-west-1

profile: sandbox-user

filters:
  instance-state-name: running
  tag:Project: secure-cicd-ecs-lab

hostnames:
  - tag:Name

compose:
  ansible_host: public_ip_address

keyed_groups:
  - key: ec2_tags.Role
    prefix: role
    separator: "_"

cache: true
cache_plugin: jsonfile
cache_connection: ./.ansible_inventory_cache
cache_timeout: 300
